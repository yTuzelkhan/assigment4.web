<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Contact Us </h2>
                <form class="needs-validation" novalidate>
                    
                    <div class="mb-3">
                        <label for="bsName" class="form-label">Name</label>
                        <input type="text" class="form-control" id="bsName" placeholder="John Doe" required>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Name is required.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="bsEmail" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="bsEmail" placeholder="name@example.com" aria-describedby="emailHelp" required>
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Email is required.</div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="bsMessage" class="form-label">Message</label>
                        <textarea class="form-control" id="bsMessage" rows="3" placeholder="Type your message here..." required></textarea>
                        <div class="valid-feedback">Looks good!</div>
                        <div class="invalid-feedback">Message is required.</div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit</button>
                     <a href="index2.html"><button class="btn btn-secondary" type="button">Third part</button></a>
                </form>
            </div>
        </div>
    </div>

    <script>
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
